# VM clone producer permissions. Only the clone resource is added here; VM,
# snapshot and storage permissions stay in the existing ani-vm-resource roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-resource-vm-clone
rules:
  - apiGroups: ["clone.kubevirt.io"]
    resources: ["virtualmachineclones"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ani-resource-vm-clone-ani-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ani-resource-vm-clone
subjects:
  - kind: ServiceAccount
    name: ani-resource-service
    namespace: ani-system
