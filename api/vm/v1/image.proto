syntax = "proto3";
package vm.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/api/vm/v1;vmv1";

import "google/protobuf/field_mask.proto";

// Trusted Governance gRPC only. Tenant identity and every native identity come
// from the authenticated caller context, never from these fields' siblings.
service VMImageService {
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc GetImage(GetImageRequest) returns (VMImage);
  // CreateImage is asynchronous: the returned record is PREPARING and carries
  // the image_id the caller needs for the upload session.
  rpc CreateImage(CreateImageRequest) returns (VMImage);
  rpc CreateUploadSession(CreateUploadSessionRequest) returns (UploadSession);
  rpc UpdateImage(UpdateImageRequest) returns (VMImage);
  rpc DeleteImage(DeleteImageRequest) returns (VMImage);
}

// ImageOS is the platform profile frozen for one image. A tenant-uploaded image
// never claims an initialization capability, so cloud-init stays unavailable.
message ImageOS {
  string os_family = 1;
  string os_version = 2;
  string architecture = 3;
  string firmware = 4;
  string root_bus = 5;
  string data_bus = 6;
  string nic_model = 7;
}

message VMImage {
  string image_id = 1;
  string media_key = 2;
  string name = 3;
  string description = 4;
  // DISK_IMAGE consumes as a cloned system disk; INSTALL_ISO as a read-only CD-ROM.
  string kind = 5;
  string format = 6;
  // PREPARING, IMPORTING, VERIFYING, READY, FAILED, UNAVAILABLE, DELETING, DELETED.
  string state = 7;
  string reason = 8;
  // NONE, PENDING, RUNNING, COMPLETE, BLOCKED.
  string cleanup_state = 9;
  // Four independent capacity measures. None is derived from another.
  int64 source_capacity_gb = 10;
  int64 source_requested_bytes = 11;
  int64 observed_source_capacity_bytes = 12;
  int64 source_checksum_bytes = 13;
  // Full-length SHA-256 of the CDI-processed source, not of the uploaded file.
  string source_sha256 = 14;
  ImageOS os = 15;
  int64 version = 16;
  string upload_deadline = 17;
  string created_by = 18;
  string created_at = 19;
  string updated_at = 20;
}

message ListImagesRequest {
  string tenant_id = 1;
  uint32 page = 2;
  uint32 page_size = 3;
  // Optional kind/state/keyword narrowing; empty means every state but DELETED.
  string kind = 4;
  string state = 5;
  string keyword = 6;
}
message ListImagesResponse {
  repeated VMImage items = 1;
  int64 total = 2;
}

message GetImageRequest {
  string tenant_id = 1;
  string image_id = 2;
}

message CreateImageRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string name = 3;
  string description = 4;
  string kind = 5;
  // qcow2 for DISK_IMAGE, iso for INSTALL_ISO.
  string format = 6;
  int64 source_capacity_gb = 7;
  ImageOS os = 8;
}

message CreateUploadSessionRequest {
  string tenant_id = 1;
  string image_id = 2;
  string idempotency_key = 3;
}

// UploadSession is a short-lived ticket. The bearer token is never stored and
// the file bytes travel from the caller straight to the upload entrypoint.
message UploadSession {
  string image_id = 1;
  string upload_session_id = 2;
  string method = 3;
  string upload_url = 4;
  string bearer_token = 5;
  string expires_at = 6;
  string content_type = 7;
  int64 max_file_bytes = 8;
}

message UpdateImageRequest {
  string tenant_id = 1;
  string image_id = 2;
  string idempotency_key = 3;
  int64 expected_version = 4;
  string name = 5;
  string description = 6;
  google.protobuf.FieldMask update_mask = 7;
}

message DeleteImageRequest {
  string tenant_id = 1;
  string image_id = 2;
  string idempotency_key = 3;
  int64 expected_version = 4;
}
