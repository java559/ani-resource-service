syntax = "proto3";
package network.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/api/network/v1;networkv1";

import "google/protobuf/timestamp.proto";

// Platform-only closure of a legacy device registration. Acceptance fences the
// old executor; blocked means external references still prevent retirement.
service PlatformDeviceRetirementService {
  rpc RetireNetworkDevice(RetireNetworkDeviceRequest) returns (RetireNetworkDeviceResponse);
  rpc GetNetworkDeviceRetirement(GetNetworkDeviceRetirementRequest) returns (GetNetworkDeviceRetirementResponse);
}

message RetireNetworkDeviceRequest {
  string device_id = 1;
  int64 expected_version = 2;
  string idempotency_key = 3;
}
message GetNetworkDeviceRetirementRequest { string device_id = 1; }
message RetireNetworkDeviceResponse { DeviceRetirement retirement = 1; }
message GetNetworkDeviceRetirementResponse { DeviceRetirement retirement = 1; }
message DeviceRetirement {
  string device_id = 1;
  string operation_id = 2;
  string state = 3; // closing, blocked, retired
  string reason = 4;
  int64 version = 5;
  int64 expected_version = 6;
  string config_uid = 7;
  int64 fence_version = 8;
  bool pending_unknown = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}
